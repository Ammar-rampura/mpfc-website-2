<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Sky Sunset Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2639"/>
      <stop offset="35%" stop-color="#3D3B54"/>
      <stop offset="55%" stop-color="#7C4348"/>
      <stop offset="75%" stop-color="#C85A32"/>
      <stop offset="90%" stop-color="#F29338"/>
      <stop offset="100%" stop-color="#FFD166"/>
    </linearGradient>

    <!-- Sun Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF4D0" stop-opacity="1"/>
      <stop offset="25%" stop-color="#FFB347" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#E86A33" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E86A33" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Cab Gradient -->
    <linearGradient id="cabBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B82229"/>
      <stop offset="45%" stop-color="#D92D34"/>
      <stop offset="80%" stop-color="#A5181E"/>
      <stop offset="100%" stop-color="#6E0F13"/>
    </linearGradient>

    <!-- Trailer Metallic Finish -->
    <linearGradient id="trailerMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2A2F35"/>
      <stop offset="50%" stop-color="#3A414A"/>
      <stop offset="100%" stop-color="#1E2328"/>
    </linearGradient>

    <!-- Glass Reflection -->
    <linearGradient id="windshieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2B37" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#3D5A73" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#F29338" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#101820" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Chrome Grill -->
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="25%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="75%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Golden Road Glow -->
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2125"/>
      <stop offset="40%" stop-color="#14171A"/>
      <stop offset="100%" stop-color="#0B0D0F"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="1920" height="1080" fill="url(#skyGrad)"/>

  <!-- Golden Setting Sun on Horizon -->
  <circle cx="960" cy="540" r="280" fill="url(#sunGlow)"/>
  <circle cx="960" cy="540" r="90" fill="#FFFBEB"/>

  <!-- Distant Mountain Ridges & Industrial Horizon Silhouettes -->
  <polygon points="0,580 280,510 580,550 890,490 1200,530 1520,480 1780,520 1920,500 1920,620 0,620" fill="#4A282D" opacity="0.6"/>
  <polygon points="0,610 350,560 720,590 1100,545 1450,580 1800,550 1920,570 1920,640 0,640" fill="#2E1C24" opacity="0.8"/>

  <!-- Highway Ground / Tarmac -->
  <polygon points="0,630 1920,630 1920,1080 0,1080" fill="url(#roadGrad)"/>

  <!-- Highway Lane Golden Markers (Perspective Lines) -->
  <polygon points="960,630 962,630 970,1080 950,1080" fill="#F59E0B" opacity="0.8"/>
  <polygon points="960,630 961,630 680,1080 660,1080" fill="#E2E8F0" opacity="0.3"/>
  <polygon points="960,630 961,630 1260,1080 1240,1080" fill="#E2E8F0" opacity="0.3"/>

  <!-- Atmospheric Dust & Road Horizon Haze -->
  <rect x="0" y="580" width="1920" height="80" fill="#E86A33" opacity="0.25"/>

  <!-- ==================== THE HEAVY MPFC FREIGHT TRUCK (CENTER HERO) ==================== -->
  <g id="MPFC_Heavy_Truck" transform="translate(480, 240)">

    <!-- Shadow under truck chassis -->
    <ellipse cx="480" cy="740" rx="460" ry="45" fill="#000000" opacity="0.85" filter="blur(10px)"/>

    <!-- Heavy Wheels & Tires (Multi-axle setup) -->
    <!-- Left Steer Wheel -->
    <rect x="150" y="600" width="90" height="150" rx="20" fill="#111827"/>
    <rect x="165" y="620" width="60" height="110" rx="14" fill="#374151"/>
    <circle cx="195" cy="675" r="22" fill="#9CA3AF"/>

    <!-- Right Steer Wheel -->
    <rect x="720" y="600" width="90" height="150" rx="20" fill="#111827"/>
    <rect x="735" y="620" width="60" height="110" rx="14" fill="#374151"/>
    <circle cx="765" cy="675" r="22" fill="#9CA3AF"/>

    <!-- Rear Cargo Trailer Mass (Behind the Cab) -->
    <rect x="180" y="60" width="600" height="420" rx="12" fill="url(#trailerMetal)"/>
    <!-- Trailer Roll Cargo Frame Ribs -->
    <line x1="260" y1="60" x2="260" y2="480" stroke="#1E2328" stroke-width="6"/>
    <line x1="380" y1="60" x2="380" y2="480" stroke="#1E2328" stroke-width="6"/>
    <line x1="580" y1="60" x2="580" y2="480" stroke="#1E2328" stroke-width="6"/>
    <line x1="700" y1="60" x2="700" y2="480" stroke="#1E2328" stroke-width="6"/>

    <!-- Truck Cab Main Body -->
    <path d="M 220 180 
             L 740 180 
             Q 770 180 780 210 
             L 810 500 
             Q 815 540 800 580 
             L 780 630 
             L 180 630 
             L 160 580 
             Q 145 540 150 500 
             L 180 210 
             Q 190 180 220 180 Z" fill="url(#cabBody)"/>

    <!-- Aerodynamic Roof Fairing & Air Deflector -->
    <polygon points="210,180 750,180 710,100 250,100" fill="#8B161B"/>
    <line x1="250" y1="100" x2="710" y2="100" stroke="#FF7E67" stroke-width="3" opacity="0.6"/>

    <!-- Top Roof Marker Lights (Amber) -->
    <rect x="290" y="110" width="30" height="10" rx="3" fill="#FBBF24" filter="drop-shadow(0 0 8px #F59E0B)"/>
    <rect x="370" y="105" width="30" height="10" rx="3" fill="#FBBF24" filter="drop-shadow(0 0 8px #F59E0B)"/>
    <rect x="465" y="102" width="30" height="10" rx="3" fill="#FBBF24" filter="drop-shadow(0 0 10px #F59E0B)"/>
    <rect x="560" y="105" width="30" height="10" rx="3" fill="#FBBF24" filter="drop-shadow(0 0 8px #F59E0B)"/>
    <rect x="640" y="110" width="30" height="10" rx="3" fill="#FBBF24" filter="drop-shadow(0 0 8px #F59E0B)"/>

    <!-- Panoramic Windshield Glass with Sunset Reflection -->
    <path d="M 235 200 
             L 725 200 
             L 750 360 
             L 210 360 Z" fill="url(#windshieldGrad)" stroke="#111827" stroke-width="8"/>
    
    <!-- Windshield Sun Glare Streak -->
    <polygon points="420,200 480,200 370,360 310,360" fill="#FFFFFF" opacity="0.18"/>
    <polygon points="560,200 640,200 590,360 510,360" fill="#F59E0B" opacity="0.25"/>

    <!-- Dual Heavy Duty Wipers -->
    <line x1="330" y1="355" x2="420" y2="280" stroke="#0F172A" stroke-width="6"/>
    <line x1="560" y1="355" x2="650" y2="280" stroke="#0F172A" stroke-width="6"/>

    <!-- Massive Heavy Duty Front Bumper & Grill Frame -->
    <rect x="200" y="380" width="560" height="230" rx="16" fill="#181B1F"/>
    
    <!-- Bold Chrome Horizontal Grill Slats -->
    <rect x="220" y="400" width="520" height="22" rx="6" fill="url(#chrome)"/>
    <rect x="220" y="435" width="520" height="22" rx="6" fill="url(#chrome)"/>
    <rect x="220" y="470" width="520" height="22" rx="6" fill="url(#chrome)"/>
    <rect x="220" y="505" width="520" height="22" rx="6" fill="url(#chrome)"/>
    <rect x="220" y="540" width="520" height="22" rx="6" fill="url(#chrome)"/>

    <!-- Chrome Side Aerodynamic Mirrors -->
    <!-- Left Mirror -->
    <polygon points="175,220 120,225 120,330 175,310" fill="#1F2937" stroke="#9CA3AF" stroke-width="3"/>
    <line x1="175" y1="230" x2="200" y2="235" stroke="#475569" stroke-width="8"/>
    <line x1="175" y1="300" x2="200" y2="305" stroke="#475569" stroke-width="8"/>

    <!-- Right Mirror -->
    <polygon points="785,220 840,225 840,330 785,310" fill="#1F2937" stroke="#9CA3AF" stroke-width="3"/>
    <line x1="785" y1="230" x2="760" y2="235" stroke="#475569" stroke-width="8"/>
    <line x1="785" y1="300" x2="760" y2="305" stroke="#475569" stroke-width="8"/>

    <!-- High-Intensity Projector Headlight Pods -->
    <!-- Left Headlight Cluster -->
    <g transform="translate(195, 575)">
      <polygon points="0,0 70,0 60,45 0,40" fill="#0F172A"/>
      <ellipse cx="25" cy="20" rx="18" ry="14" fill="#FEF08A" filter="drop-shadow(0 0 15px #FDE047)"/>
      <circle cx="25" cy="20" r="8" fill="#FFFFFF"/>
      <rect x="48" y="8" width="12" height="24" rx="3" fill="#F59E0B" filter="drop-shadow(0 0 8px #F59E0B)"/>
    </g>

    <!-- Right Headlight Cluster -->
    <g transform="translate(695, 575)">
      <polygon points="0,0 70,0 70,40 10,45" fill="#0F172A"/>
      <ellipse cx="45" cy="20" rx="18" ry="14" fill="#FEF08A" filter="drop-shadow(0 0 15px #FDE047)"/>
      <circle cx="45" cy="20" r="8" fill="#FFFFFF"/>
      <rect x="10" y="8" width="12" height="24" rx="3" fill="#F59E0B" filter="drop-shadow(0 0 8px #F59E0B)"/>
    </g>

    <!-- Lower Bull Bar & Number Plate Area -->
    <rect x="360" y="615" width="240" height="40" rx="6" fill="#F8FAFC" stroke="#0F172A" stroke-width="3"/>
    <text x="480" y="642" font-family="'Syne', monospace" font-size="18" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="4">
      MP 09 FC 1998
    </text>

    <!-- ==================== SIGNATURE EMBEDDED MPFC BADGE ON FRONT GRILL ==================== -->
    <g id="Embossed_MPFC_Logo" transform="translate(330, 420)">
      <!-- Backing Plate with Golden Sunset Edge Rim -->
      <rect x="0" y="0" width="300" height="105" rx="16" fill="#A8181F" stroke="#FBBF24" stroke-width="4" filter="drop-shadow(0 10px 25px rgba(0,0,0,0.6))"/>
      
      <!-- Inner Clean Plate -->
      <rect x="8" y="8" width="284" height="89" rx="12" fill="#8B1117"/>

      <!-- MPFC Letters (Heavy Brand Typography) -->
      <text x="100" y="66" font-family="'Syne', sans-serif" font-size="62" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
        MPFC
      </text>

      <!-- Iconic Tire Track Brand Graphic on Right -->
      <g transform="translate(195, 14)">
        <ellipse cx="45" cy="40" rx="36" ry="34" fill="none" stroke="#FFFFFF" stroke-width="9"/>
        <ellipse cx="45" cy="40" rx="22" ry="20" fill="none" stroke="#FFFFFF" stroke-width="6"/>
        <line x1="18" y1="20" x2="32" y2="32" stroke="#FFFFFF" stroke-width="4"/>
        <line x1="14" y1="40" x2="30" y2="40" stroke="#FFFFFF" stroke-width="4"/>
        <line x1="18" y1="60" x2="32" y2="48" stroke="#FFFFFF" stroke-width="4"/>
        <line x1="72" y1="20" x2="58" y2="32" stroke="#FFFFFF" stroke-width="4"/>
        <line x1="76" y1="40" x2="60" y2="40" stroke="#FFFFFF" stroke-width="4"/>
        <line x1="72" y1="60" x2="58" y2="48" stroke="#FFFFFF" stroke-width="4"/>
      </g>

      <!-- Subtitle Designation on Plate -->
      <text x="150" y="88" font-family="'Sora', sans-serif" font-size="11" font-weight="700" fill="#FEF3C7" text-anchor="middle" letter-spacing="2">
        MADHYA PRADESH FREIGHT CARRIER
      </text>
    </g>

  </g>
</svg>
